name: Finalize Backrooms generation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and force-push final source fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('BackroomsWorldGenerator.cpp')
          s = p.read_text(encoding='utf-8')
          pattern = r'void ABackroomsWorldGenerator::StartDescent\(\)\n\{.*?\n\}\n\nvoid ABackroomsWorldGenerator::OnTrapdoorOverlap'
          matches = list(re.finditer(pattern, s, re.S))
          legacy = next((m for m in matches if 'StartCameraFade' in m.group(0) and 'bPlatformDescentStarted = true' in m.group(0)), None)
          if legacy:
              s = s[:legacy.start()] + 'void ABackroomsWorldGenerator::OnTrapdoorOverlap' + s[legacy.end():]
          start = s.find('void ABackroomsWorldGenerator::OnTrapdoorOverlap')
          end = s.find('\nvoid ABackroomsWorldGenerator::RebuildAllChunks', start)
          if start >= 0 and end >= 0:
              inert = '''void ABackroomsWorldGenerator::OnTrapdoorOverlap(UPrimitiveComponent* OverlappedComponent, AActor* OtherActor,\n\tUPrimitiveComponent* OtherComp, int32 OtherBodyIndex, bool bFromSweep, const FHitResult& SweepResult)\n{\n\t// Legacy hatch transition intentionally disabled.\n}\n'''
              s = s[:start] + inert + s[end:]
          else:
              raise SystemExit('Trapdoor callback not found')
          p.write_text(s, encoding='utf-8')
          Path('.github/descent-cleanup-trigger-2.txt').unlink(missing_ok=True)
          PY
          git config user.name "backrooms-repair"
          git config user.email "actions@users.noreply.github.com"
          git add BackroomsWorldGenerator.cpp
          git add -u .github/descent-cleanup-trigger-2.txt
          git commit -m "Finalize city to Backrooms transition" || true
          git rm .github/workflows/finalize-generation-fix.yml
          git commit -m "Remove temporary finalization workflow" || true
          git push --force origin HEAD:main
