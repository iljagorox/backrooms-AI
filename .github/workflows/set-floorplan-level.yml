name: Set FloorPlan level context
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and finalize
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BackroomsWorldGenerator.cpp')
          s = p.read_text(encoding='utf-8')
          old = '\t\tPlan->RegionSizeCells = ChunkSizeCells * ExtX;\n\t\tPlan->Generate(Seed, RegionCoord);'
          new = '\t\tPlan->RegionSizeCells = ChunkSizeCells * ExtX;\n\t\tPlan->LevelIndex = LevelIndex;\n\t\tPlan->Generate(Seed, RegionCoord);'
          if old not in s:
              raise SystemExit('FloorPlan level context marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/final-fix-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "backrooms-repair"
          git config user.email "actions@users.noreply.github.com"
          git add BackroomsWorldGenerator.cpp
          git add -u .github/final-fix-trigger.txt
          git commit -m "Pass level index into FloorPlan generation"
          git rm .github/workflows/set-floorplan-level.yml
          git commit -m "Remove temporary FloorPlan level workflow"
          git push --force origin HEAD:main
