name: Apply Backrooms generation repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('BackroomsFloorPlan.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'const int32 Module = FMath::Max(8, RS / 4);'
          if old not in s: raise SystemExit('FloorPlan module marker missing')
          s = s.replace(old, 'const int32 Module = FMath::Max(8, ChunkCellSize);', 1)
          marker = '\t}\n\n\tconst int32 SpaceCount = Spaces.Num();\n'
          insertion = '''\t}\n\n\t// Enclose each authored module. Selected connections below reopen doors.\n\tfor (int32 MY = 0; MY < Modules; ++MY)\n\t{\n\t\tfor (int32 MX = 0; MX < Modules; ++MX)\n\t\t{\n\t\t\tconst int32 X0 = MX * Module;\n\t\t\tconst int32 Y0 = MY * Module;\n\t\t\tconst int32 X1 = FMath::Min(RS - 1, (MX + 1) * Module - 1);\n\t\t\tconst int32 Y1 = FMath::Min(RS - 1, (MY + 1) * Module - 1);\n\t\t\tif (MX + 1 < Modules)\n\t\t\t{\n\t\t\t\tfor (int32 Y = Y0; Y <= Y1; ++Y) SetEdge(X1, Y, EGridDir::East, EFloorEdgeState::Wall);\n\t\t\t}\n\t\t\tif (MY + 1 < Modules)\n\t\t\t{\n\t\t\t\tfor (int32 X = X0; X <= X1; ++X) SetEdge(X, Y1, EGridDir::North, EFloorEdgeState::Wall);\n\t\t\t}\n\t\t}\n\t}\n\n\tconst int32 SpaceCount = Spaces.Num();\n'''
          if marker not in s: raise SystemExit('FloorPlan boundary marker missing')
          s = s.replace(marker, insertion, 1)
          old = 'const ERoomTemplate Template = PickTemplate(Seed + InAttempt * 7919, MX, MY);'
          if old not in s: raise SystemExit('FloorPlan template marker missing')
          s = s.replace(old, 'const int32 LevelSeed = Seed + InAttempt * 7919 + LevelIndex * 104729;\n\t\t\tconst ERoomTemplate Template = PickTemplate(LevelSeed, MX, MY);', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('BackroomsWorldGenerator.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''\tStartupPlatformTrapdoor->SetCollisionEnabled(ECollisionEnabled::QueryOnly);\n\tStartupPlatformTrapdoor->SetCollisionObjectType(ECC_WorldDynamic);\n\tStartupPlatformTrapdoor->SetCollisionResponseToAllChannels(ECR_Ignore);\n\tStartupPlatformTrapdoor->SetCollisionResponseToChannel(ECC_Pawn, ECR_Overlap);\n\tStartupPlatformTrapdoor->SetGenerateOverlapEvents(true);\n\tStartupPlatformTrapdoor->OnComponentBeginOverlap.AddDynamic(this, &ABackroomsWorldGenerator::OnTrapdoorOverlap);'''
          if old not in s: raise SystemExit('WorldGenerator hatch marker missing')
          s = s.replace(old, '''\t// Legacy hatch is inert. Entry is automatic after the hidden Backrooms wave.\n\tStartupPlatformTrapdoor->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n\tStartupPlatformTrapdoor->SetGenerateOverlapEvents(false);''', 1)
          start = s.find('\t// Сорвался за край острова / провалился сквозь пол:')
          end = s.find('\n\tUpdateStreaming();', start)
          if start < 0 or end < 0: raise SystemExit('WorldGenerator fall block markers missing')
          s = s[:start] + '''\t// Automatic city -> Backrooms transition. Never fall onto the generated ceiling.\n\tif (bPlayerSeated && !bPlatformDescentDone && !bPlayerFellToBackrooms && PendingOrder.Num() == 0)\n\t{\n\t\tDescentTimer += DeltaSeconds;\n\t\tif (DescentTimer >= 1.5f) StartDescent();\n\t}\n''' + s[end:]
          s = s.replace('\n\tUpdatePlatformDescent(DeltaSeconds);', '', 1)
          marker = '\nvoid ABackroomsWorldGenerator::MarkBackroomsEntered()\n'
          if marker not in s: raise SystemExit('WorldGenerator StartDescent marker missing')
          impl = '''\nvoid ABackroomsWorldGenerator::StartDescent()\n{\n\tif (bPlatformDescentDone || bPlayerFellToBackrooms) return;\n\tAPlayerController* PC = UGameplayStatics::GetPlayerController(this, 0);\n\tAPawn* Pawn = PC ? PC->GetPawn() : nullptr;\n\tif (!Pawn) return;\n\tconst FVector BackroomsFloor(CellSize * ChunkSizeCells * 0.5f, CellSize * ChunkSizeCells * 0.5f, PawnStandZ());\n\tPawn->SetActorLocation(BackroomsFloor, false, nullptr, ETeleportType::TeleportPhysics);\n\tPawn->SetActorRotation(FRotator::ZeroRotator);\n\tif (ACharacter* Char = Cast<ACharacter>(Pawn))\n\t{\n\t\tif (UCharacterMovementComponent* Movement = Char->GetCharacterMovement())\n\t\t{\n\t\t\tMovement->StopMovementImmediately();\n\t\t\tMovement->SetMovementMode(MOVE_Walking);\n\t\t}\n\t}\n\tif (StartPlatform) { StartPlatform->Destroy(); StartPlatform = nullptr; }\n\tbPlayerSeated = false;\n\tbPlatformDescentStarted = true;\n\tbPlatformDescentDone = true;\n\tDescentTimer = 0.0f;\n\tFallTimer = 0.0f;\n\tbFallTeleported = false;\n\tMarkBackroomsEntered();\n\tExitGraceTimer = ExitGracePeriod;\n\tUE_LOG(LogTemp, Display, TEXT("BR: city -> Backrooms L0 transition complete after generation + 1.5s"));\n}\n'''
          s = s.replace(marker, impl + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "backrooms-repair"
          git config user.email "actions@users.noreply.github.com"
          git add BackroomsFloorPlan.cpp BackroomsWorldGenerator.cpp
          git commit -m "Fix Backrooms room walls and city entry transition"
          git rm .github/workflows/apply-backrooms-generation-fix.yml
          git commit -m "Remove temporary generation repair workflow"
          git push origin HEAD:main
