name: Fix descent implementation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy descent implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('BackroomsWorldGenerator.cpp')
          s = p.read_text(encoding='utf-8')
          pattern = r'void ABackroomsWorldGenerator::StartDescent\(\)\n\{.*?\n\}\n\nvoid ABackroomsWorldGenerator::OnTrapdoorOverlap'
          matches = list(re.finditer(pattern, s, re.S))
          legacy = None
          for m in matches:
              body = m.group(0)
              if 'StartCameraFade' in body and 'bPlatformDescentStarted = true' in body:
                  legacy = m
                  break
          if legacy is None:
              raise SystemExit(f'Legacy StartDescent not found; definitions={len(matches)}')
          s = s[:legacy.start()] + 'void ABackroomsWorldGenerator::OnTrapdoorOverlap' + s[legacy.end():]

          start = s.find('void ABackroomsWorldGenerator::OnTrapdoorOverlap')
          end = s.find('\nvoid ABackroomsWorldGenerator::RebuildAllChunks', start)
          if start < 0 or end < 0:
              raise SystemExit('Trapdoor callback boundaries not found')
          inert = '''void ABackroomsWorldGenerator::OnTrapdoorOverlap(UPrimitiveComponent* OverlappedComponent, AActor* OtherActor,\n\tUPrimitiveComponent* OtherComp, int32 OtherBodyIndex, bool bFromSweep, const FHitResult& SweepResult)\n{\n\t// Legacy hatch transition intentionally disabled.\n}\n'''
          s = s[:start] + inert + s[end:]
          p.write_text(s, encoding='utf-8')
          Path('.github/descent-cleanup-trigger.txt').unlink(missing_ok=True)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "backrooms-repair"
          git config user.email "actions@users.noreply.github.com"
          git add BackroomsWorldGenerator.cpp
          git add -u .github/descent-cleanup-trigger.txt
          git commit -m "Remove legacy hatch descent implementation"
          git rm .github/workflows/fix-duplicate-descent.yml
          git commit -m "Remove temporary descent cleanup workflow"
          git push origin HEAD:main
