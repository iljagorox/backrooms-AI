name: integrate-authored-chunks

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch authored chunk integration
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'MISSING PATCH ANCHOR: {path}: {old[:120]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # World generator header: expose an authored chunk catalogue.
          patch('BackroomsWorldGenerator.h',
                'class UBackroomsFloorPlan;\n',
                'class UBackroomsFloorPlan;\nclass UBackroomsAuthoredChunkLibrary;\n')
          patch('BackroomsWorldGenerator.h',
                '\tUPROPERTY(EditAnywhere, Category = "Level")\n\tTObjectPtr<ULevelGeneratorProfile> LevelProfileOverride;\n',
                '\tUPROPERTY(EditAnywhere, Category = "Level")\n\tTObjectPtr<ULevelGeneratorProfile> LevelProfileOverride;\n\n\t// Authored architecture is selected deterministically from Seed + Level + ChunkCoord.\n\t// If no library/variant is available, the existing FloorPlan/legacy path remains active.\n\tUPROPERTY(EditAnywhere, Category = "Generation|Authored")\n\tTSoftObjectPtr<UBackroomsAuthoredChunkLibrary> AuthoredChunkLibrary;\n\n\tUPROPERTY(EditAnywhere, Category = "Generation|Authored")\n\tbool bUseAuthoredChunks = true;\n')

          # World generator cpp: include library and select before FloorPlan/legacy.
          patch('BackroomsWorldGenerator.cpp',
                '#include "BackroomsFloorPlan.h"\n',
                '#include "BackroomsFloorPlan.h"\n#include "BackroomsAuthoredChunkLibrary.h"\n#include "BackroomsAuthoredChunk.h"\n')
          patch('BackroomsWorldGenerator.cpp',
                '\t\t\tULevelGeneratorProfile* Profile = GetActiveProfile();\n\t\t\tif (bUseFloorPlanLevel)\n',
                '\t\t\tULevelGeneratorProfile* Profile = GetActiveProfile();\n\n\t\t\t// Authored chunks are the preferred architecture source. The single world\n\t\t\t// seed drives variant selection; no independent random seed is introduced.\n\t\t\tif (bUseAuthoredChunks && !AuthoredChunkLibrary.IsNull())\n\t\t\t{\n\t\t\t\tif (UBackroomsAuthoredChunkLibrary* Library = AuthoredChunkLibrary.LoadSynchronous())\n\t\t\t\t{\n\t\t\t\t\tconstexpr uint32 ArchitecturePurpose = 0x41524348u; // 'ARCH'\n\t\t\t\t\tif (UBackroomsAuthoredChunk* Authored = Library->Select(Seed, LevelIndex, Coord, ArchitecturePurpose))\n\t\t\t\t\t{\n\t\t\t\t\t\tChunk->LevelStyle = (EBackroomsLevelStyle)FMath::Clamp(LevelIndex, 0, 9);\n\t\t\t\t\t\tChunk->AssignAuthoredChunk(Authored);\n\t\t\t\t\t\tChunk->BuildFromAuthoredChunk();\n\t\t\t\t\t\tGridSet(Coord, Chunk);\n\t\t\t\t\t\t++Spawned;\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif (bUseFloorPlanLevel)\n')

          # Chunk header: authored source + static mesh materialization.
          patch('BackroomsChunkActor.h',
                '#include "BackroomsFloorPlan.h"\n',
                '#include "BackroomsFloorPlan.h"\n#include "BackroomsAuthoredChunk.h"\n')
          patch('BackroomsChunkActor.h',
                'class FChunkGenerationData;\n',
                'class FChunkGenerationData;\nclass UStaticMeshComponent;\n')
          patch('BackroomsChunkActor.h',
                '\tUFUNCTION(BlueprintCallable, Category = "Chunk")\n\tvoid AssignFloorPlan(UBackroomsFloorPlan* InPlan);\n',
                '\tUFUNCTION(BlueprintCallable, Category = "Chunk")\n\tvoid AssignFloorPlan(UBackroomsFloorPlan* InPlan);\n\n\t// Authored chunk: geometry/content is authored in a DataAsset; runtime only selects\n\t// the variant and later fills its explicit sockets deterministically.\n\tUFUNCTION(BlueprintCallable, Category = "Chunk|Authored")\n\tvoid AssignAuthoredChunk(UBackroomsAuthoredChunk* InChunk);\n\n\tUFUNCTION(BlueprintCallable, Category = "Chunk|Authored")\n\tvoid BuildFromAuthoredChunk();\n')
          patch('BackroomsChunkActor.h',
                '\tUPROPERTY()\n\tTObjectPtr<UBackroomsFloorPlan> FloorPlan;\n',
                '\tUPROPERTY()\n\tTObjectPtr<UBackroomsFloorPlan> FloorPlan;\n\n\tUPROPERTY()\n\tTObjectPtr<UBackroomsAuthoredChunk> AuthoredChunk;\n\n\tUPROPERTY(VisibleAnywhere, Category = "Chunk|Authored")\n\tTObjectPtr<UStaticMeshComponent> AuthoredGeometryMesh;\n\n\tbool bUseAuthoredChunk = false;\n')

          # Chunk cpp: component + authored dispatch implementation.
          patch('BackroomsChunkActor.cpp',
                '\tGeometryMesh = CreateDefaultSubobject<UProceduralMeshComponent>(TEXT("GeometryMesh"));\n\tRootComponent = GeometryMesh;\n\tGeometryMesh->bUseComplexAsSimpleCollision = true;\n',
                '\tGeometryMesh = CreateDefaultSubobject<UProceduralMeshComponent>(TEXT("GeometryMesh"));\n\tRootComponent = GeometryMesh;\n\tGeometryMesh->bUseComplexAsSimpleCollision = true;\n\n\tAuthoredGeometryMesh = CreateDefaultSubobject<UStaticMeshComponent>(TEXT("AuthoredGeometryMesh"));\n\tAuthoredGeometryMesh->SetupAttachment(GeometryMesh);\n\tAuthoredGeometryMesh->SetVisibility(false);\n\tAuthoredGeometryMesh->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n')
          patch('BackroomsChunkActor.cpp',
                '#include "Components/BoxComponent.h"\n',
                '#include "Components/BoxComponent.h"\n#include "Components/StaticMeshComponent.h"\n')
          patch('BackroomsChunkActor.cpp',
                'void ABackroomsChunkActor::AssignFloorPlan(UBackroomsFloorPlan* InPlan)\n{\n\tFloorPlan = InPlan;\n}\n',
                'void ABackroomsChunkActor::AssignFloorPlan(UBackroomsFloorPlan* InPlan)\n{\n\tFloorPlan = InPlan;\n}\n\nvoid ABackroomsChunkActor::AssignAuthoredChunk(UBackroomsAuthoredChunk* InChunk)\n{\n\tAuthoredChunk = InChunk;\n\tbUseAuthoredChunk = (InChunk != nullptr);\n}\n\nvoid ABackroomsChunkActor::BuildFromAuthoredChunk()\n{\n\tif (!AuthoredChunk || !AuthoredGeometryMesh)\n\t{\n\t\tUE_LOG(LogTemp, Error, TEXT("BR: authored chunk requested without asset/component."));\n\t\treturn;\n\t}\n\n\tUStaticMesh* Mesh = AuthoredChunk->PreviewMesh.LoadSynchronous();\n\tif (!Mesh)\n\t{\n\t\tUE_LOG(LogTemp, Error, TEXT("BR: authored chunk %s has no PreviewMesh."), *AuthoredChunk->GetName());\n\t\treturn;\n\t}\n\n\t// The authored mesh is the architecture. Do not regenerate walls, rooms or\n\t// random geometry around it. Its authored transform is preserved.\n\tGeometryMesh->ClearAllMeshSections();\n\tGeometryMesh->SetVisibility(false);\n\tGeometryMesh->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n\n\tAuthoredGeometryMesh->SetStaticMesh(Mesh);\n\tAuthoredGeometryMesh->SetRelativeTransform(FTransform::Identity);\n\tAuthoredGeometryMesh->SetVisibility(true);\n\tAuthoredGeometryMesh->SetCollisionEnabled(ECollisionEnabled::QueryAndPhysics);\n\tAuthoredGeometryMesh->SetCollisionResponseToAllChannels(ECR_Block);\n\n\tChunkSizeCells = FMath::Max(1, AuthoredChunk->SizeCells.X);\n\tCellSize = FMath::Max(1.0f, AuthoredChunk->CellSize);\n\tUE_LOG(LogTemp, Display, TEXT("BR: Authored chunk selected: %s (L%d, %dx%d)"),\n\t\t*AuthoredChunk->ChunkId.ToString(), AuthoredChunk->LevelIndex,\n\t\tAuthoredChunk->SizeCells.X, AuthoredChunk->SizeCells.Y);\n}\n')
          patch('BackroomsChunkActor.cpp',
                '\tSeed = InSeed;\n\tDatabase = InDatabase;\n\tInstancers.Empty();\n',
                '\tSeed = InSeed;\n\tDatabase = InDatabase;\n\tInstancers.Empty();\n\n\tif (bUseAuthoredChunk && AuthoredChunk)\n\t{\n\t\tBuildFromAuthoredChunk();\n\t\treturn;\n\t}\n', 1)
          patch('BackroomsChunkActor.cpp',
                '\tSeed = InSeed;\n\tInstancers.Empty();\n\tClearMeshData();\n\n\tif (bSpawnPlatform)\n',
                '\tSeed = InSeed;\n\tInstancers.Empty();\n\tClearMeshData();\n\n\tif (bUseAuthoredChunk && AuthoredChunk)\n\t{\n\t\tBuildFromAuthoredChunk();\n\t\treturn;\n\t}\n\n\tif (bSpawnPlatform)\n', 1)

          # Sanity check: exactly one authored branch in each dispatcher.
          s = Path('BackroomsChunkActor.cpp').read_text(encoding='utf-8')
          if s.count('BuildFromAuthoredChunk();') < 2:
              raise SystemExit('Authored dispatch patch did not land in both BuildChunk functions')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BackroomsWorldGenerator.h BackroomsWorldGenerator.cpp BackroomsChunkActor.h BackroomsChunkActor.cpp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate authored chunk selection into runtime"
          git push
